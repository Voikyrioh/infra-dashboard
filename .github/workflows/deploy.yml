name: Deploy Dashboard

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract short SHA
        id: sha
        run: echo "tag=${GITHUB_SHA:0:7}" >> $GITHUB_OUTPUT

      - name: Build and push dashboard-api
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/voikyrioh/dashboard-api:${{ steps.sha.outputs.tag }}
            ghcr.io/voikyrioh/dashboard-api:latest

      - name: Build and push dashboard-frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/voikyrioh/dashboard-frontend:${{ steps.sha.outputs.tag }}
            ghcr.io/voikyrioh/dashboard-frontend:latest

      - name: Install Vault CLI
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq gpg
          wget -qO- https://apt.releases.hashicorp.com/gpg | gpg --dearmor | sudo tee /usr/share/keyrings/hashicorp-archive-keyring.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt-get update -qq && sudo apt-get install -y -qq vault

      - name: Générer .env depuis Vault
        env:
          VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
          VAULT_ROLE_ID: ${{ secrets.VAULT_ROLE_ID }}
          VAULT_SECRET_ID: ${{ secrets.VAULT_SECRET_ID }}
          IMAGE_TAG: ${{ steps.sha.outputs.tag }}
        run: |
          TOKEN=$(vault write -field=token auth/approle/login \
            role_id="$VAULT_ROLE_ID" \
            secret_id="$VAULT_SECRET_ID")
          export VAULT_TOKEN="$TOKEN"

          echo "IMAGE_TAG=$IMAGE_TAG" > .env

          if vault kv get -format=json "secret/apps/dashboard" > /tmp/vault-secrets.json 2>/dev/null; then
            jq -r '.data.data | to_entries[] | "\(.key)=\(.value)"' /tmp/vault-secrets.json >> .env
          fi

          echo "=== .env généré (clés uniquement) ==="
          cut -d= -f1 .env

      # Fiche custom_compose : provision-app ne crée ni le dossier ni le compose
      # sur le VPS — ce workflow est autoporteur. Les clés JWT sont générées une
      # fois (les régénérer invaliderait les sessions en cours).
      - name: Préparer le dossier app sur le VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            mkdir -p /opt/infra/apps/dashboard/ssl
            if [ ! -f /opt/infra/apps/dashboard/ssl/id_rsa ]; then
              ssh-keygen -t rsa -b 4096 -m PEM -N "" -f /opt/infra/apps/dashboard/ssl/id_rsa
            fi

      - name: Copy .env + docker-compose.yml to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: ".env,docker-compose.yml"
          target: /opt/infra/apps/dashboard/

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: GHCR_TOKEN
          script: |
            echo "$GHCR_TOKEN" | docker login ghcr.io -u voikyrioh --password-stdin
            cd /opt/infra/apps/dashboard
            docker compose pull
            docker compose up -d --remove-orphans
            docker compose ps
